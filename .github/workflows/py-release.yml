name: Release (PyPI)
# Push a tag like py-v0.6.1 to publish. Uses PyPI Trusted Publishing (no token):
# configure it once at https://pypi.org/manage/project/generateapikey/settings/publishing/
# with workflow "py-release.yml" and environment "pypi".
on:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: tag matches package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "py-v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != py-v$v"; exit 1; }
      - run: python -m pip install -e ".[test,all]" build twine
      - run: python -m pytest -q
      - run: python scripts/gen_vectors.py --check
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/generateapikey/
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
