name: Upload to PIP

# Publishes with PyPI Trusted Publishing (OIDC): no long-lived token stored in GitHub.
# One-time setup on PyPI -> generateapikey -> Settings -> Publishing -> add GitHub publisher:
#   owner: nuhmanpk, repository: generate-api-key, workflow: pypi-upload.yml, environment: pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,all]"
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    # Separate job: nothing from the test/build environment runs here, and only
    # this job can mint the short-lived PyPI token.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/generateapikey/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
