name: Python
on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "spec/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "spec/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,all]"
      - run: python -m pytest -q

  minimal:
    # The core must work with zero dependencies: no extras installed at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: bandit -q -r generateapikey generateApiKey.py
      # spec/vectors.json must be exactly what the Python implementation produces.
      - run: python scripts/gen_vectors.py --check

  package:
    # The sdist and wheel must build from python/ and pass twine's checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
