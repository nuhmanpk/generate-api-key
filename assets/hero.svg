<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="generateApiKey: a metallic key whose head is a small screen showing a generated API key">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#dfe6ef"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d6e3"/>
      <stop offset="0.45" stop-color="#8fa6bd"/>
      <stop offset="1" stop-color="#4d6378"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b7187"/>
      <stop offset="1" stop-color="#2c3b4a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#f5b83d"/>
      <stop offset="1" stop-color="#c98a12"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2633"/>
      <stop offset="1" stop-color="#0b1118"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2c3b4a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2c3b4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fd0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fd0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- floating characters -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" fill="#8fa6bd" opacity="0.55">
    <text x="120" y="130" font-size="34">7f</text>
    <text x="1030" y="120" font-size="30">Qx</text>
    <text x="1060" y="520" font-size="36">9K</text>
    <text x="70" y="560" font-size="28">a3</text>
    <text x="260" y="80" font-size="22">Z</text>
    <text x="930" y="70" font-size="24">m</text>
    <text x="80" y="330" font-size="26">#</text>
    <text x="1110" y="320" font-size="26">$</text>
  </g>

  <!-- ground shadow -->
  <ellipse cx="610" cy="520" rx="420" ry="34" fill="url(#shadow)"/>

  <g transform="rotate(-8 600 330)">
    <!-- shaft -->
    <rect x="470" y="300" width="560" height="64" rx="18" fill="url(#metal)"/>
    <rect x="470" y="300" width="560" height="14" rx="7" fill="#ffffff" opacity="0.35"/>
    <rect x="470" y="352" width="560" height="12" rx="6" fill="#2c3b4a" opacity="0.25"/>

    <!-- teeth: bits of code -->
    <g fill="url(#metalDark)">
      <rect x="760" y="356" width="40" height="66" rx="8"/>
      <rect x="814" y="356" width="40" height="96" rx="8"/>
      <rect x="868" y="356" width="40" height="52" rx="8"/>
      <rect x="922" y="356" width="40" height="84" rx="8"/>
      <rect x="976" y="356" width="40" height="60" rx="8"/>
    </g>
    <g fill="#3fd0ff">
      <rect x="772" y="402" width="16" height="6" rx="3"/>
      <rect x="826" y="432" width="16" height="6" rx="3"/>
      <rect x="880" y="388" width="16" height="6" rx="3"/>
      <rect x="934" y="420" width="16" height="6" rx="3"/>
      <rect x="988" y="396" width="16" height="6" rx="3"/>
    </g>

    <!-- collar -->
    <rect x="452" y="282" width="42" height="100" rx="12" fill="url(#gold)"/>
    <rect x="460" y="290" width="8" height="84" rx="4" fill="#fff4cc" opacity="0.7"/>

    <!-- head: a rounded monitor -->
    <circle cx="300" cy="332" r="200" fill="url(#glow)"/>
    <rect x="130" y="190" width="330" height="284" rx="70" fill="url(#metal)"/>
    <rect x="175" y="198" width="240" height="18" rx="9" fill="#ffffff" opacity="0.3"/>
    <rect x="162" y="226" width="266" height="200" rx="40" fill="url(#screen)"/>
    <rect x="162" y="226" width="266" height="200" rx="40" fill="none" stroke="#3fd0ff" stroke-opacity="0.35" stroke-width="3"/>

    <!-- key ring hole -->
    <circle cx="190" cy="450" r="18" fill="#dfe6ef" stroke="#4d6378" stroke-width="6"/>

    <!-- screen content -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">
      <text x="194" y="290" font-size="30" fill="#3fd0ff">sk-</text>
      <text x="194" y="336" font-size="30" fill="#e6f6ff">4fQ9</text>
      <text x="194" y="382" font-size="30" fill="#e6f6ff">x7Kp</text>
      <rect x="290" y="358" width="18" height="30" fill="#3fd0ff">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- status lights -->
    <circle cx="398" cy="262" r="8" fill="#43e08f"/>
    <circle cx="398" cy="290" r="8" fill="#f5b83d"/>
  </g>
</svg>
